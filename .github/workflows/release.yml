name: Build & release

# Every push / PR builds all three platforms and uploads the installers as workflow artifacts.
# Pushing a tag like v0.1.0 also publishes them to a GitHub Release.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version
        shell: bash
        run: echo "VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - run: cargo test --release
      - run: cargo build --release
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" packaging\windows\installer.iss
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path target\release\l4d2-addons-manager.exe, README.md, LICENSE -DestinationPath "dist\L4D2-Addons-Manager-$env:VERSION-windows-x64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    runs-on: ubuntu-22.04 # older glibc = runs on more distros
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      - name: Version
        run: echo "VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - run: cargo test --release
      - run: cargo build --release
      - name: .deb
        run: |
          cargo install cargo-deb --locked
          mkdir -p dist
          cargo deb --no-build --output "dist/l4d2-addons-manager_${VERSION}_amd64.deb"
      - name: .tar.gz (any distro / SteamOS)
        run: |
          D="L4D2-Addons-Manager-$VERSION-linux-x64"
          mkdir -p "$D"
          cp target/release/l4d2-addons-manager packaging/linux/l4d2-addons-manager.desktop packaging/linux/install.sh README.md LICENSE "$D/"
          cp assets/icon-256.png "$D/l4d2-addons-manager.png"
          chmod +x "$D/install.sh" "$D/l4d2-addons-manager"
          tar czf "dist/$D.tar.gz" "$D"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Version
        run: echo "VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - run: cargo test --release
      - run: sh packaging/macos/bundle.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
